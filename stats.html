<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>כמה נכנסו למשחק</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 40px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #0e1621; color: #e8eef5;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #8fa4bb; font-size: 14px; margin-bottom: 22px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 26px; }
  .card {
    flex: 1 1 150px; background: #17222f; border: 1px solid #24334512;
    border-radius: 12px; padding: 14px 16px;
  }
  .card .n { font-size: 30px; font-weight: 700; color: #ffd75e; line-height: 1.1; }
  .card .l { font-size: 13px; color: #8fa4bb; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid #1e2a38; }
  th { color: #8fa4bb; font-weight: 600; font-size: 13px; }
  td.bar { width: 62%; }
  .b { height: 15px; border-radius: 4px; background: linear-gradient(90deg,#3b82f6,#60a5fa); }
  .today td { background: #182636; }
  .today .day::after { content: " ← היום"; color: #ffd75e; font-size: 12px; }
  .msg { color: #8fa4bb; padding: 20px 0; }
  a { color: #60a5fa; }
</style>
</head>
<body>
<div class="wrap">
  <h1>כמה נכנסו למשחק</h1>
  <div class="sub">שכונת פסגת זאב מרכז · המספרים מתעדכנים בזמן אמת</div>
  <div class="cards">
    <div class="card"><div class="n" id="cToday">–</div><div class="l">היום</div></div>
    <div class="card"><div class="n" id="cWeek">–</div><div class="l">7 ימים אחרונים</div></div>
    <div class="card"><div class="n" id="cMonth">–</div><div class="l">30 ימים אחרונים</div></div>
    <div class="card"><div class="n" id="cAll">–</div><div class="l">מכשירים שונים מאז ומעולם</div></div>
  </div>
  <table>
    <thead><tr><th>תאריך</th><th>כניסות</th><th class="bar"></th></tr></thead>
    <tbody id="rows"><tr><td colspan="3" class="msg">טוען…</td></tr></tbody>
  </table>
  <p class="sub" style="margin-top:22px">
    כניסה נספרת פעם אחת ליום לכל מכשיר. לא נשמר שום מידע אישי — רק מונה.
    <br><a href="./">חזרה למשחק</a>
  </p>
</div>
<script>
const API = 'https://pisgat-zeev-leaderboard.g0527111319.workers.dev';
const heb = d => new Date(d + 'T00:00:00').toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' });
(async () => {
  const rows = document.getElementById('rows');
  let data;
  try {
    const r = await fetch(API + '?stat=daily&days=30', { cache: 'no-store' });
    data = await r.json();
  } catch (e) {
    rows.innerHTML = '<tr><td colspan="3" class="msg">אין חיבור לשרת הסטטיסטיקה</td></tr>';
    return;
  }
  const days = data.days || [];
  const today = new Date().toLocaleDateString('en-CA');
  const sum = n => days.slice(-n).reduce((s, d) => s + d.visits, 0);
  const t = days.find(d => d.date === today);
  document.getElementById('cToday').textContent = t ? t.visits : 0;
  document.getElementById('cWeek').textContent = sum(7);
  document.getElementById('cMonth').textContent = sum(30);
  document.getElementById('cAll').textContent = data.total ?? '–';
  if (!days.length) {
    rows.innerHTML = '<tr><td colspan="3" class="msg">עדיין אין נתונים — הספירה היומית התחילה עכשיו</td></tr>';
    return;
  }
  const max = Math.max(...days.map(d => d.visits), 1);
  rows.innerHTML = days.slice().reverse().map(d =>
    '<tr class="' + (d.date === today ? 'today' : '') + '">' +
      '<td class="day">' + heb(d.date) + '</td>' +
      '<td>' + d.visits + '</td>' +
      '<td class="bar"><div class="b" style="width:' + Math.round(100 * d.visits / max) + '%"></div></td>' +
    '</tr>').join('');
})();
</script>
</body>
</html>
